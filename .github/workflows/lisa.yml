name: LISA QA Automation
on: [push, pull_request, workflow_dispatch]
jobs:
  lisa:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run LISA
      run: docker compose up --build
    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: lisa-reports
        path: backend/runs/
